<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>7-Course French Tasting Menu</title>
<style>
*{box-sizing:border-box}
:root{--coral:#f26f5e;--green:#0b6b57;--cream:#fff8f1;--ink:#1d1d1d}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--cream);color:var(--ink);line-height:1.55}
main{max-width:980px;margin:0 auto;padding:34px 18px}
.hero{background:#fff;border:1px solid #eadfd4;border-radius:26px;padding:30px;box-shadow:0 12px 30px rgba(0,0,0,.04)}
.badge{display:inline-block;background:var(--green);color:white;border-radius:999px;padding:7px 14px;font-family:system-ui,sans-serif;font-size:13px}
h1{color:var(--green);font-size:38px;margin:18px 0 8px}
h2{color:var(--coral);margin-top:34px}
.dish{background:#fff;border:1px solid #eadfd4;border-radius:20px;padding:20px;margin-top:16px}
.wine{margin-top:10px;background:#fff3ed;border-left:4px solid var(--coral);padding:10px 14px;border-radius:10px}
.photoSlot{margin-top:14px;border:2px dashed #eadfd4;border-radius:18px;padding:26px;text-align:center;color:#999;font-family:system-ui,sans-serif}
.footer{margin-top:30px;background:var(--green);color:white;border-radius:24px;padding:24px}
.error{background:#fff4f4;border:1px solid #ffd0d0;padding:14px;border-radius:12px}
.menuImg{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:20px;
  margin:18px 0;
  border:1px solid #eadfd4;
}
</style>
</head>
<body>
<main id="content"></main>

<script>
const params=new URLSearchParams(location.search);
const code=(params.get('code')||'').trim();

function parseYYMMDDHH(s){
  if(!/^\d{8}$/.test(s)) return null;
  const yy=Number(s.slice(0,2)), mm=Number(s.slice(2,4)), dd=Number(s.slice(4,6)), hh=Number(s.slice(6,8));
  return new Date(2000+yy,mm-1,dd,hh,0,0);
}

const sessionDate=parseYYMMDDHH(code);
if(!sessionDate){
  content.innerHTML='<div class="error">Invalid or missing access code.</div>';
  throw new Error('invalid');
}
const expiryDate=new Date(sessionDate);
expiryDate.setMonth(expiryDate.getMonth()+1);
if(Date.now()>expiryDate.getTime()){
  content.innerHTML='<div class="error">This menu is no longer available.</div>';
  throw new Error('expired');
}

content.innerHTML=`
<section class="hero">
  <span class="badge">Foodie Experiences Paris</span>
  <h1>Our 7-Course French Tasting Menu</h1>
  <p>An authentic journey through the finest regional flavors of France…</p>
</section>

<div class="dish">
  <h2>🍽️ French Onion Soup</h2>
  <p>Slowly caramelized onions simmered in a rich broth, topped with toasted bread and melted cheese. A timeless Parisian classic and one of France’s most beloved comfort foods.
  </p>
  <div class="wine"><strong>Wine pairing:</strong>Muscadet Sur Lie (Loire Valley) - resh, crisp, and mineral, with lively citrus notes that balance the sweetness of the onions and refresh the palate..</div>
</div>

<div class="dish">
  <h2>🍽️ Mimosa Eggs</h2>
  <p>A French bistro favorite. Creamy seasoned egg yolks delicately piped back into the whites and topped with finely grated egg, resembling the flowers of the mimosa tree.</p>
  <div class="wine"><strong>Wine pairing:</strong> Chinon (Cabernet Franc)
  An elegant Loire Valley - red with fresh red fruit aromas and soft tannins.</div>
</div>

<div class="dish">
  <h2>🍽️ Burgundy Snails Roasted with Garlic-Parsley Butter</h2>
  <img class="menuImg" src="/assets/menus/escargots.jpg" alt="Burgundy snails with garlic parsley butter">
  <p>Tender escargots, rich and savory, roasted in their shells.</p>
  <div class="wine"><strong>Wine pairing:</strong> Colombard-Sauvignon (Comté Tolosan) - Bright and aromatic, with refreshing notes of grapefruit and herbs that complement the richness of the butter and garlic.</div>
</div>

<div class="dish">
  <h2>🍽️ Aveyron Sausage and Aligot</h2>
  <p>One of the great specialties of rural France. Traditional pork sausage served with Aligot, a spectacular blend of mashed potatoes and melted Tomme cheese, famous for its long, silky texture.</p>
  <div class="wine"><strong>Wine pairing:</strong> Bordeaux – Côtes de Blaye - A classic blend of Cabernet Sauvignon and Merlot offering dark fruit, spice, and structure to complement the richness of the dish.</div>
</div>

<div class="dish">
  <h2>🍽️ Camembert from Normandy, Aged 29 Days</h2>
  <p>Creamy, earthy cheese served with raw apple slices and Isigny butter.</p>
  <div class="wine"><strong>Wine pairing:</strong> Côtes du Rhône - A generous southern French red with notes of ripe fruit, pepper, and Mediterranean herbs.</div>
</div>

<div class="dish">
  <h2>🍽️ Roquefort Cheese from Aveyron, Aged 45 Days</h2>
  <p>The legendary blue cheese aged in the natural caves of southern France. Powerful, creamy, salty, and wonderfully complex.</p>
  <div class="wine"><strong>Wine pairing:</strong>Sweet French Dessert Wine - A classic French pairing where sweetness softens the saltiness of the cheese and creates remarkable balance.</div>
</div>

<div class="dish">
  <h2>Tarte Tatin</h2>
  <p>A legendary upside-down caramelized apple tart, born from a beautiful French kitchen “mistake.” Golden, buttery, and deeply comforting, it is one of France’s most beloved desserts.</p>
  <div class="wine"> <strong>Wine pairing : </strong> Champagne - Elegant bubbles, delicate brioche notes, and a refreshing finish that beautifully balances the caramelized apples and buttery pastry.</div>
</div>

<div class="footer">
  <p>It was such a pleasure to meet you. 💕</p>
  <p>If you'd like to explore more French gastronomy, we offer private culinary experiences for:<br>
  – Birthday parties<br>– Romantic dinners<br>– Team-building events<br>– Cocktail kick-offs<br>… and more!</p>
  <p>We’d love to hear what you thought of the experience in your review. Feel free to write it in your native language 🥳</p>
  <p><strong>Let’s stay in touch:</strong><br>
  👨‍🍳 Chef Alex<br>
  🌐 Foodie-Experiences.com<br>
  📱 WhatsApp: +33 (0)6 63 30 62 14<br>
  📸 YouTube: ChefAlexParis</p>
</div>
`;
</script>
</body>
</html>
