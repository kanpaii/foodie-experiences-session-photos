<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>7-Course French Tasting</title>

  <style>
    *{box-sizing:border-box}

    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      max-width:900px;
      margin:40px auto;
      padding:0 16px;
      line-height:1.5;
      color:#111;
    }

    h1,h2,h3{
      line-height:1.2;
    }

    .hero{
      margin-bottom:24px;
    }

    .hero p{
      color:#555;
      font-size:17px;
    }

    .dish{
      margin-top:28px;
      padding-top:24px;
      border-top:1px solid #eee;
    }

    .dish img{
      width:100%;
      border-radius:18px;
      margin-top:14px;
    }

    .wine{
      background:#faf7f2;
      padding:12px 14px;
      border-radius:12px;
      margin-top:12px;
    }

    .footer{
      margin-top:40px;
      padding:22px;
      border-radius:18px;
      background:#fafafa;
      border:1px solid #eee;
    }

    .error{
      background:#fff4f4;
      border:1px solid #ffd0d0;
      padding:14px;
      border-radius:12px;
      margin-top:18px;
    }
  </style>
</head>
<body>

<div id="content"></div>

<script>
const params = new URLSearchParams(location.search);
const code = (params.get('code') || '').trim();

function parseYYMMDDHH(s){
  if(!/^\d{8}$/.test(s)) return null;

  const yy = Number(s.slice(0,2));
  const mm = Number(s.slice(2,4));
  const dd = Number(s.slice(4,6));
  const hh = Number(s.slice(6,8));

  const year = 2000 + yy;

  return new Date(year, mm-1, dd, hh, 0, 0);
}

const sessionDate = parseYYMMDDHH(code);

if(!sessionDate){
  document.getElementById('content').innerHTML =
    '<div class="error">Invalid or missing access code.</div>';
  throw new Error('invalid');
}

const expiryDate = new Date(sessionDate);
expiryDate.setMonth(expiryDate.getMonth() + 1);

if(Date.now() > expiryDate.getTime()){
  document.getElementById('content').innerHTML =
    '<div class="error">This menu is no longer available.</div>';
  throw new Error('expired');
}

document.getElementById('content').innerHTML = `
  <div class="hero">
    <h1>🍽️ 7-Course French Tasting Menu</h1>

    <p>
      Did you enjoy our 7 dishes 7 wines tasting in Paris? 🤗
    </p>

    <p>
      We hope your tastebuds are still smiling.
    </p>
  </div>

  <div class="dish">
    <h2>🦪 Fresh Oysters from Brittany</h2>

    <p>
      Fine de Claire No. 3 oysters served with Normandy butter,
      bread, lemon and mignonette sauce.
    </p>

    <div class="wine">
      <strong>Wine pairing:</strong><br/>
      Muscadet Sèvre-et-Maine sur Lie
    </div>
  </div>

  <div class="dish">
    <h2>🐸 Sautéed Frog Legs</h2>

    <p>
      Pan-seared in parsley garlic butter.
    </p>

    <div class="wine">
      <strong>Wine pairing:</strong><br/>
      Menetou-Salon Red
    </div>
  </div>

  <div class="dish">
    <h2>🐌 Burgundy Snails</h2>

    <p>
      Roasted with garlic parsley butter.
    </p>

    <div class="wine">
      <strong>Wine pairing:</strong><br/>
      Chablis
    </div>
  </div>

  <div class="dish">
    <h2>🥘 Burgundy-style Beef Stew</h2>

    <p>
      Traditional slow-cooked French beef stew.
    </p>

    <div class="wine">
      <strong>Wine pairing:</strong><br/>
      Graves Red Bordeaux
    </div>
  </div>

  <div class="dish">
    <h2>🧀 Camembert from Normandy</h2>

    <p>
      Served with apples and Isigny butter.
    </p>
  </div>

  <div class="dish">
    <h2>🧀 Roquefort Cheese</h2>

    <p>
      Sheep milk blue cheese with blueberry jam.
    </p>
  </div>

  <div class="dish">
    <h2>🍓 Strawberry Tart</h2>

    <p>
      Strawberry Gariguette tart with raspberry & chantilly sauces.
    </p>

    <div class="wine">
      <strong>Wine pairing:</strong><br/>
      Blanc de Blancs Champagne
    </div>
  </div>

  <div class="footer">
    <h3>💕 Thank you for joining us</h3>

    <p>
      We offer private culinary experiences in Paris:
    </p>

    <ul>
      <li>Birthday parties</li>
      <li>Romantic dinners</li>
      <li>Corporate events</li>
      <li>Team building</li>
    </ul>

    <p>
      👨‍🍳 Chef Alex
    </p>
  </div>
`;
</script>

</body>
</html>
